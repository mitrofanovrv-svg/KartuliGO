<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#145c4c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="КартулиГО" />
  <meta name="description" content="Учи грузинский с русского: первые слова, фразы, картинки, буквы и упражнения. Бесплатно и офлайн." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>КартулиГО v0.5 — учим грузинский</title>
</head>
<body>
  <div id="app"><div class="boot">გამარჯობა! 🇬🇪</div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./audio-map.js" defer></script>
  <script src="./app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
      let updating = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (!updating) { updating = true; location.reload(); } });
    }
  </script>
</body>
</html>
